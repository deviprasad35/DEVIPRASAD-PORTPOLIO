<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Hexagon: flat-top orientation, centred at 60,60, radius ~50 -->
  <polygon
    points="60,10 103,35 103,85 60,110 17,85 17,35"
    stroke="url(#stroke-grad)"
    stroke-width="5"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- DP text centred inside the hexagon -->
  <text
    x="60"
    y="72"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-weight="700"
    font-size="36"
    fill="url(#text-grad)"
  >DP</text>
</svg>
